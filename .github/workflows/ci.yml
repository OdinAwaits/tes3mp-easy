name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check shell syntax
        run: |
          bash -n bootstrap.sh
          sh -n rootctl/tes3mp-easy-rootctl

      - name: Validate sudoers
        run: sudo visudo -cf sudoers.d/tes3mp-easy

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build ops
        run: go build -o /tmp/tes3mp-easy-ops ./cmd/tes3mp-easy-ops
