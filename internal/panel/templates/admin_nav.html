{{define "adminNav"}}
<header class="topbar">
  <a class="brand" href="/admin">
    <span class="brand-mark" aria-hidden="true">◆</span>
    <span>TES3MP <strong>Easy</strong></span>
  </a>
  <nav class="nav" aria-label="Разделы панели">
    <a href="/admin"{{if eq .ActiveNav "dashboard"}} aria-current="page"{{end}}>Обзор</a>
    <a href="/admin/logs"{{if eq .ActiveNav "logs"}} aria-current="page"{{end}}>Логи</a>
    <a href="/admin/mods"{{if eq .ActiveNav "mods"}} aria-current="page"{{end}}>Моды</a>
    <a href="/admin/state"{{if eq .ActiveNav "state"}} aria-current="page"{{end}}>Состояния</a>
    <a href="/admin/config"{{if eq .ActiveNav "config"}} aria-current="page"{{end}}>Настройки</a>
    <a href="/admin/staff"{{if eq .ActiveNav "staff"}} aria-current="page"{{end}}>Staff</a>
    <a href="/backups" target="_blank" rel="noopener">Публичные архивы</a>
  </nav>
  <details class="account">
    <summary class="button button--ghost button--small">Аккаунт</summary>
    <div class="account-menu">
      <a href="/admin/password"{{if eq .ActiveNav "password"}} aria-current="page"{{end}}>Сменить пароль</a>
      <form method="post" action="/admin/logout">
        {{template "csrf" .}}
        <button class="button button--ghost button--small" type="submit">Выйти</button>
      </form>
    </div>
  </details>
</header>
{{end}}
