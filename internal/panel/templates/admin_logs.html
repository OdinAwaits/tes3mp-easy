{{define "title"}}Логи — tes3mp-easy{{end}}
{{define "scripts"}}
  <script defer src="/static/admin.js"></script>
{{end}}
{{define "content"}}
<main class="page">
    <div class="page-head">
      <p class="eyebrow">Диагностика</p>
      <h1>Логи</h1>
      <p class="lead">Последние строки журнала panel и игрового сервера обновляются автоматически.</p>
    </div>

    {{template "notices" .}}

    <form class="toolbar" method="get" action="/admin/logs">
      <div class="field">
        <label for="tail">Последних строк</label>
        <input id="tail" type="number" name="tail" min="1" max="2000" value="{{.Tail}}">
      </div>
      <button type="submit">Показать</button>
      <button class="button button--ghost" type="button" id="log-toggle">Пауза</button>
    </form>

    <pre class="log-panel" id="admin-logs" data-tail="{{.Tail}}">{{range .Lines}}{{.}}
{{end}}</pre>
  </main>
{{end}}
