<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Смена пароля — tes3mp-easy</title>
</head>
<body>
  <main>
    <h1>Смена пароля</h1>
    {{if .MustChange}}<p>Вы вошли с временным паролем. Задайте новый пароль, чтобы продолжить.</p>{{end}}
    {{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/admin/password">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <p>
        <label for="current_password">Текущий пароль</label><br>
        <input id="current_password" type="password" name="current_password"
               autocomplete="current-password" required>
      </p>
      <p>
        <label for="new_password">Новый пароль (не менее 12 символов)</label><br>
        <input id="new_password" type="password" name="new_password"
               autocomplete="new-password" minlength="12" required>
      </p>
      <p>
        <label for="confirm_password">Повторите новый пароль</label><br>
        <input id="confirm_password" type="password" name="confirm_password"
               autocomplete="new-password" minlength="12" required>
      </p>
      <button type="submit">Сохранить пароль</button>
    </form>
    {{if not .MustChange}}<p><a href="/admin">Вернуться в панель</a></p>{{end}}
  </main>
</body>
</html>
